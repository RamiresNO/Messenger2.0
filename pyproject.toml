[project]
name = "onegram-messenger"
version = "1.0.0"
description = "Python Workers messenger with a local Python server"
requires-python = ">=3.12"
dependencies = ["workers-runtime-sdk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "auth", "worker"]

[dependency-groups]
dev = ["workers-py"]